databases:
  - name: parking-db
    plan: free
    region: frankfurt
    databaseName: parkingdb
    user: parkingapp
services:
  - type: web
    name: parking-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: parking-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: parking-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: parking-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: parking-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: parking-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false
  - type: web
    name: parking-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
