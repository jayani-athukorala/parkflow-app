services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parkingdb
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
    ports:
      - "5432:5432"
    volumes:
      - parking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parkingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/parkingdb
      DB_USERNAME: parking
      DB_PASSWORD: parking
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  parking_pgdata: